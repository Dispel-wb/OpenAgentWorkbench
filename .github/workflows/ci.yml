name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-audit:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Restore locked build dependencies
        shell: pwsh
        run: |
          python -m pip install Pillow==12.3.0
          .\restore_build_dependencies.ps1
      - name: Build OpenSource edition
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          .\build_exe.ps1 -Edition OpenSource -DependencyRoot .\.packages -PythonPath $python -OutputPath .\dist\ci\OpenAgentWorkbench.exe
      - name: Restore locked Pi runtime
        shell: pwsh
        run: .\install_pi_runtime.ps1
      - name: Verify reproducible build
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          .\tests\reproducible-build.ps1 -Edition OpenSource -DependencyRoot .\.packages -PythonPath $python -ReportPath .\dist\ci\reproducible-build.json
      - name: Run offline regression
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\dist\ci\OpenAgentWorkbench.exe).Path
          $node = (Get-Command node).Source
          .\tests\webview-runtime-selftest.ps1 -DependencyRoot .\.packages
          .\tests\agent-worker-sdk-integration.ps1 -Executable $exe -DependencyRoot .\.packages
          node .\tests\pi-worker-sdk-integration.js $exe
          if ($LASTEXITCODE -ne 0) { throw 'Pi genuine runtime regression failed' }
          .\tests\pi-host-integration.ps1 -Executable $exe
          .\tests\dsh-worker-sdk-integration.ps1 -Executable $exe -NodePath $node
          .\tests\sdk-frame-reader-selftest.ps1 -DependencyRoot .\.packages
          .\tests\release-signature-policy-selftest.ps1
          .\tests\release-ci-gate-selftest.ps1
          .\tests\v1-readiness-selftest.ps1
          .\tests\host-startup-failure-selftest.ps1 -Executable $exe
          foreach ($fault in @('oversize','flood','byte-flood','malformed','eof')) {
            .\tests\dsh-worker-sdk-integration.ps1 -Executable $exe -NodePath $node -Fault $fault
          }
          .\tests\event-store-selftest.ps1 -Executable $exe
          .\tests\task-security-selftest.ps1 -Executable $exe
          .\tests\skill-catalog-selftest.ps1 -Executable $exe
          .\tests\native-diagnostics-selftest.ps1 -Executable $exe
          node .\tests\ui-contract-selftest.js
          if ($LASTEXITCODE -ne 0) { throw 'UI contract failed' }
          node .\tests\ui-connection-state-selftest.js
          if ($LASTEXITCODE -ne 0) { throw 'UI connection state failed' }
          node .\tests\bootstrap-workspace-selftest.js
          if ($LASTEXITCODE -ne 0) { throw 'Workspace bootstrap failed' }
          node .\tests\public-doc-links-selftest.js
          if ($LASTEXITCODE -ne 0) { throw 'Public documentation links failed' }
          .\tests\edition-smoke.ps1 -Executable $exe -ExpectedEdition opensource -NodePath $node
      - name: Security release gate
        shell: pwsh
        run: .\tests\release-security-audit.ps1 -Root . -Executable .\dist\ci\OpenAgentWorkbench.exe -ReportPath .\dist\ci\security-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: open-agent-workbench-ci-${{ github.run_number }}
          path: |
            dist/ci/OpenAgentWorkbench.exe
            dist/ci/*.json
          if-no-files-found: error

  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          base-ref: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
