name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true

permissions:
  contents: write
  checks: read

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'push') { $env:REF_NAME.TrimStart('v') } else { $env:INPUT_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Invalid release version: $version" }
          $edition = Get-Content .\native\EditionInfo.cs -Raw
          $declared = [regex]::Match($edition, 'ContractVersion\s*=\s*"([^"]+)"').Groups[1].Value
          if ($version -ne $declared) { throw "Release label $version does not match source version $declared" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Verify actual CI for this exact commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\tests\require-release-ci.ps1 -Repository $env:GITHUB_REPOSITORY -Commit $env:GITHUB_SHA
      - name: Build and gate
        shell: pwsh
        run: |
          python -m pip install Pillow==12.3.0
          .\restore_build_dependencies.ps1
          $python = (Get-Command python).Source
          $node = (Get-Command node).Source
          .\build_exe.ps1 -Edition OpenSource -DependencyRoot .\.packages -PythonPath $python -OutputPath .\dist\release\OpenAgentWorkbench.exe
          .\tests\reproducible-build.ps1 -Edition OpenSource -DependencyRoot .\.packages -PythonPath $python -ReportPath .\dist\release\reproducible-build.json
          .\tests\edition-smoke.ps1 -Executable .\dist\release\OpenAgentWorkbench.exe -ExpectedEdition opensource -NodePath $node
          .\tests\release-security-audit.ps1 -Root . -Executable .\dist\release\OpenAgentWorkbench.exe -ReportPath .\dist\release\security-audit.json
      - name: Require stable release evidence for the exact binary
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: .\tests\require-v1-readiness.ps1 -Version $env:RELEASE_VERSION -Executable .\dist\release\OpenAgentWorkbench.exe -EvidenceDirectory ".\release-evidence\$env:RELEASE_VERSION"
      - name: Package release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $stage = ".\dist\release\OpenAgentWorkbench-$version-win-x64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath .\dist\release\OpenAgentWorkbench.exe -Destination $stage
          Copy-Item -LiteralPath .\README.md,.\LICENSE,.\SECURITY.md,.\THIRD_PARTY_NOTICES.md -Destination $stage
          Copy-Item -LiteralPath .\third_party,.\docs -Destination $stage -Recurse
          $evidence = ".\release-evidence\$version"
          if (Test-Path -LiteralPath $evidence) { Copy-Item -LiteralPath $evidence -Destination "$stage\release-evidence" -Recurse }
          Copy-Item -LiteralPath .\install_dsh_runtime.ps1 -Destination $stage
          New-Item -ItemType Directory -Path "$stage\runtimes\dsh" -Force | Out-Null
          Copy-Item -LiteralPath .\runtimes\dsh\package.json,.\runtimes\dsh\package-lock.json -Destination "$stage\runtimes\dsh"
          Copy-Item -LiteralPath .\install_pi_runtime.ps1 -Destination $stage
          New-Item -ItemType Directory -Path "$stage\runtimes\pi" -Force | Out-Null
          Copy-Item -LiteralPath .\runtimes\pi\package.json,.\runtimes\pi\package-lock.json -Destination "$stage\runtimes\pi"
          Compress-Archive -LiteralPath $stage -DestinationPath "$stage.zip" -CompressionLevel Optimal
          Get-FileHash "$stage.zip",.\dist\release\OpenAgentWorkbench.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content .\dist\release\SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenAgentWorkbench-${{ steps.version.outputs.version }}
          path: |
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
            dist/release/*.json
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $flags = if ($env:RELEASE_VERSION.Contains('-')) { @('--prerelease') } else { @() }
          gh release create $env:REF_NAME .\dist\release\*.zip .\dist\release\SHA256SUMS.txt .\dist\release\*.json --verify-tag --generate-notes --title "Open Agent Workbench $env:RELEASE_VERSION" @flags
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
