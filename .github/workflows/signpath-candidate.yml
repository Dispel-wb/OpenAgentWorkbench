name: SignPath candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version without a leading v
        required: true
        default: 1.0.0

permissions:
  actions: read
  contents: read

jobs:
  build-test-sign:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate signing configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          foreach ($name in @('SIGNPATH_API_TOKEN','SIGNPATH_ORGANIZATION_ID','SIGNPATH_PROJECT_SLUG','SIGNPATH_SIGNING_POLICY_SLUG','SIGNPATH_ARTIFACT_CONFIGURATION_SLUG')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing required SignPath setting: $name" }
          }
          if ('${{ inputs.version }}' -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw 'Invalid candidate version' }
      - name: Restore locked dependencies
        shell: pwsh
        run: |
          python -m pip install Pillow==12.3.0
          .\restore_build_dependencies.ps1
          .\install_pi_runtime.ps1
          npm audit --omit=dev --audit-level=high --prefix .\runtimes\pi
          npm audit --omit=dev --audit-level=high --prefix .\runtimes\dsh
      - name: Build unsigned candidate
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          .\build_exe.ps1 -Edition OpenSource -DependencyRoot .\.packages -PythonPath $python -OutputPath .\dist\signpath\unsigned\OpenAgentWorkbench.exe
      - name: Verify reproducibility
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          .\tests\reproducible-build.ps1 -Edition OpenSource -DependencyRoot .\.packages -PythonPath $python -ReportPath .\dist\signpath\reproducible-build.json
      - name: Full offline regression and security gate
        shell: pwsh
        run: |
          .\tests\run-offline-regression.ps1 -Executable .\dist\signpath\unsigned\OpenAgentWorkbench.exe -OutputDirectory .\dist\signpath\offline-regression -DependencyRoot .\.packages -ExpectedEdition opensource -TestTimeoutSeconds 300
          .\tests\release-security-audit.ps1 -Root . -Executable .\dist\signpath\unsigned\OpenAgentWorkbench.exe -ReportPath .\dist\signpath\unsigned-security-audit.json
      - name: Record unsigned identity
        id: unsigned
        shell: pwsh
        run: |
          $exe = Resolve-Path .\dist\signpath\unsigned\OpenAgentWorkbench.exe
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          "sha256=$hash" >> $env:GITHUB_OUTPUT
      - name: Upload unsigned candidate for SignPath
        id: upload_unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signpath-unsigned-${{ github.run_id }}
          path: dist/signpath/unsigned/OpenAgentWorkbench.exe
          if-no-files-found: error
          retention-days: 7
      - name: Submit signing request
        id: signpath
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signpath/signed
      - name: Verify signed candidate
        id: signed
        shell: pwsh
        run: |
          $exe = Get-ChildItem -LiteralPath .\dist\signpath\signed -Recurse -File -Filter OpenAgentWorkbench.exe | Select-Object -Single
          if (-not $exe) { throw 'Signed executable was not returned' }
          $signature = Get-AuthenticodeSignature -LiteralPath $exe.FullName
          if ($signature.Status -ne 'Valid') { throw "Authenticode verification failed: $($signature.Status)" }
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe.FullName)
          if ($version.ProductName -ne 'Open Agent Workbench' -or $version.FileVersion -ne '1.0.0.0') { throw "Unexpected product metadata: $($version.ProductName) $($version.FileVersion)" }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -File -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found' }
          & $signtool.FullName verify /pa /all $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw 'signtool verification failed' }
          .\tests\edition-smoke.ps1 -Executable $exe.FullName -ExpectedEdition opensource -NodePath (Get-Command node).Source
          .\tests\release-security-audit.ps1 -Root . -Executable $exe.FullName -ReportPath .\dist\signpath\signed-security-audit.json
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
      - name: Write promotion manifest
        shell: pwsh
        run: |
          $manifest = [ordered]@{
            schemaVersion = 1
            product = 'Open Agent Workbench'
            version = '${{ inputs.version }}'
            commit = '${{ github.sha }}'
            runId = '${{ github.run_id }}'
            unsignedSha256 = '${{ steps.unsigned.outputs.sha256 }}'
            signedSha256 = '${{ steps.signed.outputs.sha256 }}'
            signingRequestId = '${{ steps.signpath.outputs.signing-request-id }}'
            signingRequestUrl = '${{ steps.signpath.outputs.signing-request-web-url }}'
            signedArtifactDownloadUrl = '${{ steps.signpath.outputs.signed-artifact-download-url }}'
            state = 'signed-candidate-awaiting-external-certification'
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath .\dist\signpath\promotion-manifest.json -Encoding utf8NoBOM
      - name: Upload signed candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signpath-signed-candidate-${{ inputs.version }}-${{ github.run_id }}
          path: |
            dist/signpath/signed/OpenAgentWorkbench.exe
            dist/signpath/promotion-manifest.json
            dist/signpath/reproducible-build.json
            dist/signpath/unsigned-security-audit.json
            dist/signpath/signed-security-audit.json
            dist/signpath/offline-regression/regression.json
          if-no-files-found: error
          retention-days: 30
