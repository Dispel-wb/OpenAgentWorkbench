name: Provenance candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-test-attest:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Restore locked dependencies
        shell: pwsh
        run: |
          python -m pip install Pillow==12.3.0
          .\restore_build_dependencies.ps1
          .\install_pi_runtime.ps1
      - name: Build candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\dist\provenance -Force | Out-Null
          .\build_exe.ps1 -Edition OpenSource -DependencyRoot .\.packages -PythonPath (Get-Command python).Source -OutputPath .\dist\provenance\OpenAgentWorkbench.exe
      - name: Full release gate
        shell: pwsh
        run: |
          npm audit --omit=dev --audit-level=high --prefix .\runtimes\pi
          npm audit --omit=dev --audit-level=high --prefix .\runtimes\dsh
          .\tests\package-mode-selftest.ps1 -Executable .\dist\provenance\OpenAgentWorkbench.exe
          .\tests\provenance-workflow-selftest.ps1
          .\tests\run-offline-regression.ps1 -Executable .\dist\provenance\OpenAgentWorkbench.exe -OutputDirectory .\dist\provenance\offline-regression -DependencyRoot .\.packages -ExpectedEdition opensource
          .\tests\release-security-audit.ps1 -Root . -Executable .\dist\provenance\OpenAgentWorkbench.exe -ReportPath .\dist\provenance\security-audit.json
      - name: Write checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\provenance\OpenAgentWorkbench.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Resolve-Path .\dist\provenance).Path + '\SHA256SUMS.txt', "$hash  OpenAgentWorkbench.exe`n", [Text.UTF8Encoding]::new($false))
      - name: Create GitHub artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/provenance/OpenAgentWorkbench.exe
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Create and verify keyless Sigstore bundle
        shell: pwsh
        env:
          COSIGN_YES: 'true'
        run: |
          $artifact = '.\dist\provenance\OpenAgentWorkbench.exe'
          $bundle = '.\dist\provenance\OpenAgentWorkbench.exe.sigstore.json'
          cosign sign-blob $artifact --bundle $bundle --yes
          cosign verify-blob $artifact --bundle $bundle --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/provenance.yml@${{ github.ref }}" --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: open-agent-workbench-provenance-${{ github.run_number }}
          path: |
            dist/provenance/OpenAgentWorkbench.exe
            dist/provenance/OpenAgentWorkbench.exe.sigstore.json
            dist/provenance/SHA256SUMS.txt
            dist/provenance/security-audit.json
            dist/provenance/offline-regression/regression.json
          if-no-files-found: error
